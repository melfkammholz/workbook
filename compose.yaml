# Run the workbook on your own computer:
#
#   docker compose up -d
#   open http://localhost:8080
#
# Add your course in the app, using the address of its repository.
# Update the app:  git pull && docker compose up -d --build
#
# Course authors: put the folder you are writing in into compose.override.yaml, see the README.
services:
  workbook:
    build: .
    ports:
      # Only reachable from this computer.
      - "127.0.0.1:8080:8080"
    volumes:
      # Your answers, notes and progress. Keep this volume to keep your work.
      - workbook-data:/data
    mem_limit: 2g
    pids_limit: 1024
    restart: unless-stopped

volumes:
  workbook-data:
